{% extends 'base.html' %} {% block content %}
<section class="max-w-5xl mx-auto space-y-8">
  <div class="bg-card-light dark:bg-card-dark p-6 rounded">
    <h1
      class="text-3xl font-display font-bold text-primary mb-6 border-b border-border-light dark:border-border-dark pb-2"
    >
      Associated PTI Journals
    </h1>

    <p class="mb-8 text-lg text-gray-700 dark:text-gray-300">
      {{ page.intro_text|safe }}
    </p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      {% for journal in journals %}
      <div
        class="flex flex-col border border-border-light dark:border-border-dark rounded overflow-hidden bg-white dark:bg-gray-800 hover: transition"
      >
        <div
          class="bg-gray-200 h-32 flex items-center justify-center text-gray-500"
        >
          <span class="text-gray-600 font-bold text-xl"
            >[Journal Cover Image]</span
          >
        </div>
        <div class="p-6 flex flex-col grow">
          <h3 class="font-bold text-xl text-primary mb-2">
            {{ journal.name }}
          </h3>
          <p class="text-sm text-gray-600 dark:text-gray-400 mb-4 flex-grow">
            {{ journal.description }}
          </p>
          <div class="text-sm font-semibold text-gray-500 mb-4">
            ISSN: {{ journal.issn }}
          </div>
          <a
            href="{{ journal.url }}"
            class="text-white bg-primary text-center py-2 px-4 rounded hover:bg-opacity-90 transition mt-auto"
            >Visit Journal Website</a
          >
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
