{% extends 'base.html' %}{% load static %}
{% block content %}
<section class="max-w-5xl mx-auto space-y-8">
  <div class="bg-card-light dark:bg-card-dark p-8 rounded">
    <h1 class="text-3xl font-display font-bold text-primary mb-6 border-b border-border-light dark:border-border-dark pb-2">Open Access Policy</h1>
    {% with s=page.sections_dict %}
    {% if s.content %}<div class="prose dark:prose-invert max-w-none text-gray-800 dark:text-gray-200">{{ s.content.text_content|safe }}</div>{% endif %}
    {% endwith %}
  </div>
</section>
{% endblock %}
