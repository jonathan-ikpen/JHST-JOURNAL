{% extends 'base.html' %} {% block content %}
<section
  class="max-w-md mx-auto bg-card-light dark:bg-card-dark p-8 rounded shadow my-12"
>
  <h2
    class="text-2xl font-display font-bold text-primary mb-4 border-b border-border-light dark:border-border-dark pb-2"
  >
    Password Reset Complete
  </h2>
  <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">
    Your password has been reset successfully. You can now log in with your new
    password.
  </p>
  <a
    href="{% url 'login' %}"
    class="block text-center w-full bg-primary text-white font-bold py-2 px-4 rounded hover:bg-opacity-90 transition"
  >
    Log In
  </a>
</section>
{% endblock %}
