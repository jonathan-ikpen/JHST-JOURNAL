{% extends 'base.html' %} {% block content %}
<section
  class="max-w-md mx-auto bg-card-light dark:bg-card-dark p-8 rounded shadow my-12"
>
  <h2
    class="text-2xl font-display font-bold text-primary mb-4 border-b border-border-light dark:border-border-dark pb-2"
  >
    Check Your Email
  </h2>
  <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">
    If an account exists for that email address, a password reset link has been
    sent. Please check your inbox (and spam folder) and follow the instructions.
  </p>
  <p class="text-sm text-gray-600 dark:text-gray-400">
    <a href="{% url 'login' %}" class="text-primary hover:underline"
      >Back to login</a
    >.
  </p>
</section>
{% endblock %}
