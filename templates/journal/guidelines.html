{% extends 'base.html' %}
{% load static %}
{% block content %}
<section class="max-w-5xl mx-auto space-y-8">
    <div class="bg-card-light dark:bg-card-dark p-8 rounded">
        <h1 class="text-3xl font-display font-bold text-primary mb-6 border-b border-border-light dark:border-border-dark pb-2">
            Guidelines
        </h1>

        {% with s=page.sections_dict %}

        {% if s.intro %}
        <div class="mb-8 prose dark:prose-invert max-w-none text-gray-800 dark:text-gray-200">
            {{ s.intro.text_content|safe }}
        </div>
        {% endif %}

        {% if s.guideline_cards %}
        <div class="my-8">
            {{ s.guideline_cards.text_content|safe }}
        </div>
        {% endif %}

        {% endwith %}
    </div>
</section>
{% endblock %}
